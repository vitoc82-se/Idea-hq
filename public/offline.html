<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Offline · Idea HQ</title>
<link rel="icon" href="/icons/icon-192.png">
<style>
  :root { color-scheme: light dark; --bg:#f8faf9; --fg:#10201a; --muted:#3b4d45; --accent:#047857; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --fg:#e6efea; --muted:#b7c7bf; --accent:#34d399; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; box-sizing:border-box; }
  main { max-width:28rem; }
  h1 { font-size:1.5rem; margin:0 0 .5rem; }
  p { color:var(--muted); line-height:1.55; margin:0 0 1rem; }
  button { font:inherit; min-height:44px; padding:0 1.25rem; border-radius:.6rem; border:0; background:var(--accent); color:#04281d; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>Idea HQ needs a connection to show your projects. Nothing is lost: your ideas are saved on the server. Check your connection, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
